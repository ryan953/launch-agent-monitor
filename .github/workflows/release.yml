name: Release

# On-demand only — never triggered by pushes to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0 or 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# The Homebrew cask is not updated from here. ryan953/homebrew-tap reads the
# published releases of every entry it carries and bumps itself, so a release
# needs no write access to another repository and no token to hold it.
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      # Settle on both spellings of the version once, so the tag, the
      # Info.plist and the tap bump can never disagree about the leading "v".
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SHORT="${INPUT_VERSION#v}"
          if [[ ! "$SHORT" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 0.1.0 or v0.1.0, got '$INPUT_VERSION'" >&2
            exit 1
          fi
          echo "VERSION=v${SHORT}" >> "$GITHUB_ENV"
          echo "SHORT_VERSION=${SHORT}" >> "$GITHUB_ENV"
          echo "tag=v${SHORT}" >> "$GITHUB_OUTPUT"

      # Built one slice per arch and lipo'd together rather than
      # `swift build --arch arm64 --arch x86_64`, which routes through
      # xcbuild and needs a full Xcode install.
      - name: Build universal binary
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx14.0
          swift build -c release --triple x86_64-apple-macosx14.0
          mkdir -p dist
          lipo -create -output dist/BGMonitor \
            .build/arm64-apple-macosx/release/BGMonitor \
            .build/x86_64-apple-macosx/release/BGMonitor
          lipo -info dist/BGMonitor

      - name: Package BGMonitor.app
        run: |
          set -euo pipefail
          APP="dist/BGMonitor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/BGMonitor "$APP/Contents/MacOS/BGMonitor"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BGMonitor</string>
            <key>CFBundleDisplayName</key><string>BG Monitor</string>
            <key>CFBundleIdentifier</key><string>com.ryan953.bgmonitor</string>
            <key>CFBundleExecutable</key><string>BGMonitor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${SHORT_VERSION}</string>
            <key>CFBundleVersion</key><string>${SHORT_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          # Ad-hoc signature: unsigned/unnotarized either way, but this keeps
          # the bundle from being rejected outright on Apple Silicon.
          codesign --force --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/BGMonitor-${VERSION}-macos-universal.zip"

      # Two assets: the app bundle for /Applications, and the bare universal
      # executable for running straight from a terminal.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'MD'
          Universal (Apple Silicon + Intel) build of BG Monitor, macOS 14+.

          ## Install

          ```sh
          brew install --cask ryan953/tap/bg-monitor
          ```

          Or download the zip below, unzip it, and drag **BGMonitor.app** to
          `/Applications`. `BGMonitor` is the bare universal executable, for
          running straight from a terminal.

          The build is ad-hoc signed rather than notarized, so the first launch
          needs **right-click → Open** (once), or:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/BGMonitor.app"
          ```
          MD
          )
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --prerelease="$PRERELEASE" \
            "dist/BGMonitor-${VERSION}-macos-universal.zip" \
            "dist/BGMonitor"
